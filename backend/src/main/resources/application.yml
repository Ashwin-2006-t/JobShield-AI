server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: jobshield-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/jobshield_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
    expiration-ms: 86400000
  services:
    ml-service-url: ${ML_SERVICE_URL:http://localhost:8001}
    ml-internal-secret: ${ML_INTERNAL_SECRET:JobShieldInternalMLKey_2026}
    gemini:
      api-key: ${GEMINI_API_KEY:demo_key}
      model: gemini-1.5-flash

cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://localhost:8081"
    - "exp://localhost:8081"

